<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Balança da justiça em ambiente jurídico</title>
  <desc id="desc">Imagem escura e elegante com uma balança da justiça dourada sobre uma base, representando o Direito.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#1b1713"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d190"/>
      <stop offset="45%" stop-color="#b88439"/>
      <stop offset="100%" stop-color="#6f4a1d"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2a26"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="42%" r="55%">
